[project]
name = "python_module_04"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy",
    "ruff",
    "flake8>=7.3.0",
]

[tool.ruff]
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

# The subject forbids the `with` statement before ex3, so ex0-ex2 must open
# streams manually with explicit try/finally close(). Allow SIM115 there.
[tool.ruff.lint.per-file-ignores]
"src/ex0/*" = ["SIM115"]
"src/ex1/*" = ["SIM115"]
"src/ex2/*" = ["SIM115"]

[tool.mypy]
strict = true
files = ["src"]
